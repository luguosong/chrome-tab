<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>启动页</title>
<style>
  :root{
    --bg:#0e1014; --card:#15181f; --border:#232733;
    --text:#e6e8ee; --dim:#8b91a0;
    --accent:#d97151;          /* Claude 珊瑚橙 */
    --up:#ff5c5c; --down:#3ddc97;  /* 红涨绿跌（A 股习惯，全市场统一） */
    --mono:"JetBrains Mono","Cascadia Code",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 600px at 70% -10%,#1a1f2b 0,var(--bg) 60%);
    color:var(--text);
    font:15px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    padding:28px clamp(16px,4vw,48px) 40px;
  }
  /* ---------- 顶部 ---------- */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:22px}
  .clock{font-size:clamp(40px,6vw,64px);font-weight:700;letter-spacing:-1px;line-height:1}
  .clock small{display:block;font-size:14px;font-weight:400;color:var(--dim);margin-top:6px;letter-spacing:0}
  .search{flex:1;max-width:520px;min-width:240px}
  .search input{
    width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);
    padding:12px 16px;border-radius:10px;font-size:15px;outline:none;transition:.15s;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,113,81,.15)}
  /* ---------- 布局 ---------- */
  main{display:grid;gap:18px;grid-template-columns:1fr 1fr;grid-template-areas:"nav stock" "cl cl"}
  @media(max-width:860px){main{grid-template-columns:1fr;grid-template-areas:"nav" "stock" "cl"}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
  .nav-card{grid-area:nav}.stock-card{grid-area:stock}.cl-card{grid-area:cl}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);
     display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  /* ---------- 导航 ---------- */
  .nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
  .nav-tile{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:12px 6px;border:1px solid var(--border);border-radius:10px;
    color:var(--text);text-decoration:none;font-size:12px;transition:.15s;cursor:pointer;
  }
  .nav-tile:hover{border-color:var(--accent);background:#1b1f28;transform:translateY(-1px)}
  .nav-tile img{width:22px;height:22px;border-radius:5px}
  .nav-tile span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav-tile .del{position:absolute;top:3px;right:5px;font-size:13px;color:var(--dim);
     opacity:0;cursor:pointer;line-height:1}
  .nav-tile:hover .del{opacity:1}.nav-tile .del:hover{color:var(--up)}
  .nav-add{display:flex;gap:6px;margin-top:12px}
  .nav-add input{flex:1;background:#0e1014;border:1px solid var(--border);color:var(--text);
     padding:8px 10px;border-radius:8px;font-size:13px;outline:none}
  .nav-add input:focus{border-color:var(--accent)}
  .nav-add button{background:var(--accent);color:#fff;border:none;padding:0 14px;border-radius:8px;cursor:pointer;font-size:13px}
  /* ---------- 股票 ---------- */
  .stock-head{display:flex;gap:10px;align-items:center}
  .stock-head button{background:transparent;border:1px solid var(--border);color:var(--dim);
     border-radius:7px;padding:3px 9px;cursor:pointer;font-size:12px}
  .stock-head button:hover{color:var(--accent);border-color:var(--accent)}
  .stock-head .updated{font-size:11px;color:var(--dim);font-family:var(--mono)}
  .stock-group{font-size:11px;color:var(--dim);letter-spacing:1px;margin:10px 0 4px}
  .stock-group:first-of-type{margin-top:0}
  .stock-row{display:grid;grid-template-columns:1fr auto;gap:4px;padding:7px 0;border-bottom:1px solid #1d212b}
  .stock-row:last-child{border-bottom:none}
  .stock-name{font-size:13px}.stock-code{font-size:11px;color:var(--dim);font-family:var(--mono)}
  .stock-price{font-family:var(--mono);font-size:14px;text-align:right}
  .stock-chg{font-family:var(--mono);font-size:12px;text-align:right}
  .up{color:var(--up)}.down{color:var(--down)}
  .stock-err{color:var(--dim);font-size:11px;margin-top:8px}
  /* ---------- 更新日志 ---------- */
  .cl-body{max-height:520px;overflow:auto;padding-right:6px}
  .cl-body::-webkit-scrollbar{width:8px}.cl-body::-webkit-scrollbar-thumb{background:#2a2f3b;border-radius:4px}
  .cl-version{margin-bottom:18px}
  .cl-version h3{font-size:17px;color:var(--accent);font-family:var(--mono);margin-bottom:6px}
  .cl-version h4{font-size:13px;color:var(--text);margin:8px 0 4px}
  .cl-version ul{list-style:none;padding-left:0}
  .cl-version li{font-size:13px;color:var(--dim);padding:2px 0 2px 14px;position:relative}
  .cl-version li::before{content:"·";position:absolute;left:4px;color:var(--accent)}
  .cl-version code{background:#0e1014;padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:12px;color:var(--text)}
  .cl-version a{color:var(--accent)}
  .cl-empty{color:var(--dim);font-size:13px}
</style>
</head>
<body>
  <header>
    <div class="clock"><div id="time">--:--</div><small id="date">—</small></div>
    <form class="search" id="search"><input id="q" placeholder="搜索或输入网址，回车跳转" autocomplete="off"></form>
  </header>

  <main>
    <!-- 导航 -->
    <section class="card nav-card">
      <h2>快速导航</h2>
      <div class="nav-grid" id="navGrid"></div>
      <form class="nav-add" id="navAdd">
        <input id="navName" placeholder="名称" maxlength="12">
        <input id="navUrl" placeholder="https://…" style="flex:2">
        <button>添加</button>
      </form>
    </section>

    <!-- 行情 -->
    <section class="card stock-card">
      <h2>
        <span>行情</span>
        <span class="stock-head">
          <span class="updated" id="stockUpdated"></span>
          <button id="stockRefresh">刷新</button>
        </span>
      </h2>
      <div id="stockList"></div>
    </section>

    <!-- 更新日志 -->
    <section class="card cl-card">
      <h2><span>Claude Code 更新日志</span><input id="clSearch" placeholder="过滤版本号…" style="background:#0e1014;border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:7px;font-size:12px;outline:none"></h2>
      <div class="cl-body" id="clBody"><div class="cl-empty">加载中…</div></div>
    </section>
  </main>

<script>
/* ============================================================
   1) 时钟 + 搜索
   ============================================================ */
const $ = id => document.getElementById(id);
function tick(){
  const d = new Date();
  $("time").textContent = d.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});
  const w=["日","一","二","三","四","五","六"][d.getDay()];
  $("date").textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 周${w}`;
}
tick(); setInterval(tick,1000*10);

$("search").addEventListener("submit",e=>{
  e.preventDefault();
  const v=$("q").value.trim(); if(!v) return;
  const isUrl=/^https?:\/\//i.test(v)||/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(v);
  location.href = isUrl ? (v.startsWith("http")?v:"https://"+v) : "https://www.google.com/search?q="+encodeURIComponent(v);
});

/* ============================================================
   2) 网站导航（localStorage 可编辑）
   ============================================================ */
const NAV_KEY="nav_links";
const DEFAULT_NAV=[
  {name:"GitHub",url:"https://github.com"},
  {name:"谷歌",url:"https://www.google.com"},
  {name:"StackOverflow",url:"https://stackoverflow.com"},
  {name:"MDN",url:"https://developer.mozilla.org"},
  {name:"知乎",url:"https://www.zhihu.com"},
  {name:"掘金",url:"https://juejin.cn"},
  {name:"V2EX",url:"https://www.v2ex.com"},
  {name:"npm",url:"https://www.npmjs.com"},
  {name:"React",url:"https://react.dev"},
  {name:"Vue",url:"https://vuejs.org"},
  {name:"B站",url:"https://www.bilibili.com"},
  {name:"HN",url:"https://news.ycombinator.com"},
];
function loadNav(){ try{return JSON.parse(localStorage.getItem(NAV_KEY))||DEFAULT_NAV}catch{return DEFAULT_NAV} }
function saveNav(list){ localStorage.setItem(NAV_KEY,JSON.stringify(list)); }
function renderNav(){
  const grid=$("navGrid"); grid.innerHTML="";
  loadNav().forEach((it,i)=>{
    const domain=new URL(it.url).hostname;
    const a=document.createElement("a"); a.className="nav-tile"; a.href=it.url;
    a.innerHTML=`<img src="https://www.google.com/s2/favicons?domain=${domain}&sz=64" referrerpolicy="no-referrer"><span>${it.name}</span><span class="del" title="删除">×</span>`;
    a.querySelector(".del").addEventListener("click",e=>{e.preventDefault();const l=loadNav();l.splice(i,1);saveNav(l);renderNav();});
    grid.appendChild(a);
  });
}
$("navAdd").addEventListener("submit",e=>{
  e.preventDefault();
  const name=$("navName").value.trim(), url=$("navUrl").value.trim();
  if(!name||!url) return;
  if(!/^https?:\/\//i.test(url)) url="https://"+url;
  const l=loadNav(); l.push({name,url}); saveNav(l);
  $("navName").value="";$("navUrl").value=""; renderNav();
});
renderNav();

/* ============================================================
   3) 股票行情 —— 统一走腾讯 qt.gtimg.cn
   <script> 加载返回 v_<sym>="..." 全局变量，天然绕 CORS（免代理免 key），
   覆盖美股(us)/A 股(sh/sz)/指数。file:// 双击打开也能用。
   字段(~分隔): [1]名称 [3]最新价 [4]昨收；涨跌自算避免索引差异
   ============================================================ */
const STOCKS=[
  {sym:"usAAPL",name:"苹果"},
  {sym:"usMSFT",name:"微软"},
  {sym:"usNVDA",name:"英伟达"},
  {sym:"usTSLA",name:"特斯拉"},
  {sym:"usGOOGL",name:"谷歌"},
  {sym:"usDJI", name:"道指"},
  {sym:"usIXIC",name:"纳指"},
  {sym:"usINX", name:"标普500"},
  {sym:"sh000001",name:"上证指数"},
  {sym:"sz399001",name:"深证成指"},
  {sym:"sz399006",name:"创业板指"},
  {sym:"sh600519",name:"贵州茅台"},
  {sym:"sz300750",name:"宁德时代"},
];
// <script> 加载腾讯行情，读全局 v_<sym>
function loadQuotes(syms){
  return new Promise((res,rej)=>{
    const s=document.createElement("script"); let done=false;
    const cleanup=()=>{clearTimeout(t);s.remove();};
    s.onload=()=>{done=true;cleanup();const out={};syms.forEach(k=>out[k]=window["v_"+k]||"");res(out);};
    s.onerror=()=>{cleanup();rej(new Error("行情加载失败"));};
    const t=setTimeout(()=>{if(!done){cleanup();rej(new Error("行情超时"));}},8000);
    s.src="https://qt.gtimg.cn/q="+syms.join(",");
    document.body.appendChild(s);
  });
}
function parseQuote(str){
  if(!str) return null;
  const a=str.split("~"); const price=parseFloat(a[3]), prev=parseFloat(a[4]);
  if(!price||!prev) return null;
  return {price, prev, change:price-prev, pct:(price-prev)/prev*100};
}
function fmtRow(s,q){
  const up=q.change>=0; const cls=up?"up":"down"; const arr=up?"▲":"▼";
  const code=s.sym.replace(/^(us|sh|sz)/,"");
  return `<div class="stock-row">
    <div><div class="stock-name">${s.name}</div><div class="stock-code">${code}</div></div>
    <div><div class="stock-price ${cls}">${q.price.toFixed(2)}</div>
    <div class="stock-chg ${cls}">${arr} ${Math.abs(q.change).toFixed(2)} (${Math.abs(q.pct).toFixed(2)}%)</div></div>
  </div>`;
}
async function loadStocks(){
  const list=$("stockList"); list.innerHTML=`<div class="stock-err">加载中…</div>`;
  const syms=STOCKS.map(s=>s.sym);
  let data={}, headErr="";
  try{ data=await loadQuotes(syms); }catch(e){ headErr=e.message; }
  const groups={us:[],cn:[]}; const miss=[];
  STOCKS.forEach(s=>{
    const q=parseQuote(data[s.sym]);
    if(q) (s.sym.startsWith("us")?groups.us:groups.cn).push(fmtRow(s,q));
    else miss.push(s.name);
  });
  if(groups.us.length) groups.us.unshift(`<div class="stock-group">美股 / 指数</div>`);
  if(groups.cn.length) groups.cn.unshift(`<div class="stock-group">A 股</div>`);
  const tail=(headErr?`<div class="stock-err">${headErr}</div>`:"")+(miss.length?`<div class="stock-err">无数据：${miss.join("，")}</div>`:"");
  list.innerHTML = groups.us.join("")+groups.cn.join("")+tail || `<div class="stock-err">无行情数据</div>`;
  $("stockUpdated").textContent="更新于 "+new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});
}
$("stockRefresh").addEventListener("click",loadStocks);
loadStocks();
setInterval(()=>{ if(!document.hidden) loadStocks(); }, 1000*60);  // 每 60s，页面隐藏时跳过

/* ============================================================
   4) Claude Code 更新日志：拉 GitHub raw 的 CHANGELOG.md 并渲染
   ============================================================ */
const CL_URL="https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md";

// 极简 markdown 渲染（针对 changelog 的标题/列表/行内代码），不引入依赖
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
}
function parseChangelog(md){
  const out=[]; let ver=null;
  const flush=()=>{ if(ver) out.push(ver); };
  for(const raw of md.split("\n")){
    const line=raw.replace(/\r/,"");
    const h=line.match(/^##\s+(.+)/);            // ## 标题 = 一个版本
    if(h){ flush(); ver={title:h[1].trim(), sections:[], top:[]}; continue; }
    const h3=line.match(/^###\s+(.*)/);
    if(h3 && ver){ ver.sections.push({name:h3[1].trim(), items:[]}); continue; }
    const li=line.match(/^[-*]\s+(.*)/);
    if(li && ver){
      const sec=ver.sections[ver.sections.length-1];
      (sec?sec.items:ver.top).push(li[1]);
    }
  }
  flush();
  return out;
}
function drawChangelog(versions){
  const q=$("clSearch").value.trim().toLowerCase();
  const list=q?versions.filter(v=>v.title.toLowerCase().includes(q)):versions.slice(0,20);
  if(!list.length){ $("clBody").innerHTML=`<div class="cl-empty">无匹配版本</div>`; return; }
  $("clBody").innerHTML=list.map(v=>{
    const secs=[...(v.top&&v.top.length?[{name:"更新",items:v.top}]:[]),...v.sections]
      .map(s=>`<h4>${inline(s.name)}</h4><ul>${s.items.map(i=>`<li>${inline(i)}</li>`).join("")}</ul>`).join("");
    return `<div class="cl-version"><h3>${inline(v.title)}</h3>${secs}</div>`;
  }).join("");
}
$("clSearch").addEventListener("input",()=>drawChangelog(window.__cl||[]));
(async()=>{
  try{
    const r=await fetch(CL_URL,{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const versions=parseChangelog(await r.text());
    if(!versions.length){ $("clBody").innerHTML=`<div class="cl-empty">未解析到版本</div>`; return; }
    window.__cl=versions; drawChangelog(versions);
  }catch(e){
    $("clBody").innerHTML=`<div class="cl-empty">拉取失败（${e.message}）—— 需 http(s) 访问，不能用 file:// 打开</div>`;
  }
})();
</script>
</body>
</html>
