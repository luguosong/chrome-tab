# 生产栈(Node):caddy(前端构建 + TLS 反代)+ Node backend(SQLite),无 mysql。
# 用法:docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# 数据:./backend/data 下 SQLite(WAL);备份每日 VACUUM INTO(票 09),恢复 = 拷回文件。
services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - caddy_data:/data
    depends_on:
      - backend
    restart: unless-stopped

  # 译制外呼代理(2026-08-23):aihubmix/raw.githubusercontent 被 GFW 阻断,经 mihomo 出境。
  # 配置 ./mihomo/config.yaml(含订阅 token,只在服务器,不进 git)。
  mihomo:
    image: metacubex/mihomo:latest
    volumes:
      - ./mihomo:/root/.config/mihomo
    expose:
      - "7890"
    restart: unless-stopped

  backend:
    build:
      context: . # pnpm workspace:lockfile 与全部包清单必须在 context 内(票 02)
      dockerfile: backend/Dockerfile
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD} # 仅空库首启 seed 生效;已有数据全跳过
      AIHUBMIX_API_KEY: ${AIHUBMIX_API_KEY}
      QWEATHER_API_KEY: ${QWEATHER_API_KEY}
      QWEATHER_API_HOST: ${QWEATHER_API_HOST}
      # 滴答清单「待办」(CONTEXT.md):API 口令,同 bing/virxact 先例国内直连
      DIDA365_TOKEN: ${DIDA365_TOKEN}
      # 视频更新(CONTEXT.md「视频更新」,ADR-0024):两键均可缺省——无 key 走 RSS 降级、
      # 无 Cookie 的 B站博主标红待自愈。YouTube RSS/API 走代理,B站三域直连(勿代理,风控敏感)
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      BILIBILI_COOKIE: ${BILIBILI_COOKIE}
      # 模型追踪评测(issues/08,CONTEXT.md「评测结果」):Artificial Analysis 免费 API Key,
      # 可缺省——未配置时评测区显示「未配置」,不影响模型档案;走代理(不在 NO_PROXY)
      ARTIFICIALANALYSIS_API_KEY: ${ARTIFICIALANALYSIS_API_KEY}
      # Node24 原生 fetch 默认忽略代理变量,须开此开关(译制/拉原文走 mihomo,qweather/npm 直连)。
      # 新闻国内源(ADR-0027)须直连:走境外代理访问国内 CDN 延迟尖刺叠 10s 超时 → 首取连轮
      # 失败、条目池空(2026-08-26 cls/wallstreetcn 空 tab 事故)。github/hackernews/producthunt
      # 是 GFW 敏感境外源,留在代理侧;新增源须同步此清单(sources.test.ts 部署契约把关)
      NODE_USE_ENV_PROXY: "1"
      HTTPS_PROXY: http://mihomo:7890
      NO_PROXY: localhost,127.0.0.1,.qweatherapi.com,registry.npmjs.org,.bing.com,.virxact.com,.dida365.com,.bilibili.com,.biliapi.net,.biliapi.com,.hdslb.com,.cls.cn,.wallstcn.com,.weibo.com,.baidu.com,.36kr.com,.ithome.com,.thepaper.cn,.v2ex.com,.zhihu.com,.sspai.com,.solidot.org,.cankaoxiaoxi.com,.zaochenbao.com
    volumes:
      - ./backend/data:/app/backend/data
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  caddy_data:
