# Node 后端栈:caddy(前端构建 + TLS 反代,根 Dockerfile 零改动)+ Node backend。
# 用途:本地以容器形态起整套栈(8081/8082 端口映射,不占线上 80/443);线上用 docker-compose.prod.yml。
# 注意:backend build context 必须是仓库根(pnpm workspace 的 lockfile 与包清单在根,
# 「backend/ 路径」由 dockerfile 路径沿用),caddy 服务定义与 prod 零差异(端口映射除外)。
services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # 本地/演练用映射,避免与线上 80/443 冲突;容器内仍为标准 80/443
      - "8081:80"
      - "8443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - caddy_data:/data
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  caddy_data:
