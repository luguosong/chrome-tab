# 生产 profile：容器内 8080、cookie secure（HTTPS）、datasource 走容器网络。
# COOKIE_SECURE：域名 + HTTPS 部署保持默认 true；裸 IP（HTTP）部署须传 false，否则浏览器丢弃会话 Cookie。
server:
  port: 8080
  servlet:
    session:
      cookie:
        secure: ${COOKIE_SECURE:true}

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:newtab}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USER:newtab}
    password: ${DB_PASSWORD}
