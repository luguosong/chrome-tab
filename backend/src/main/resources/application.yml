server:
  port: 8081  # 8080 在本机被占用，改用 8081
  servlet:
    session:
      cookie:
        http-only: true
        secure: false        # 本地 http；生产 prod profile 改 true
        same-site: strict
        max-age: 30d

spring:
  application:
    name: newtab
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:19002/newtab?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}   # 开发复用本地 docker uocs-mysql，密码走环境变量
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate    # Flyway 管 schema，Hibernate 只校验
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:12345678}   # 必填，空则首启报错

logging:
  level:
    com.personal.newtab: DEBUG
